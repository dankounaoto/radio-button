<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RADIO BUTTON｜選ぶだけ音楽ラジオ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0c10;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{max-width:680px;margin:auto;padding:34px 18px 120px}h1{font-size:34px;margin:0}.sub{color:#aaa;margin:7px 0 30px}
h2{font-size:17px;color:#ccc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;border-radius:18px;padding:22px 14px;font-size:17px;font-weight:750;cursor:pointer;background:#1b1d24;color:white}
button:hover{background:#272a33}.player{position:fixed;left:0;right:0;bottom:0;background:#15171d;border-top:1px solid #2b2e36;padding:14px 18px}
.inner{max-width:680px;margin:auto}.now{display:flex;align-items:center;justify-content:space-between;gap:12px}.station{min-width:0}
.station small{display:block;color:#9297a2;margin-bottom:3px}.station strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;gap:8px}.controls button{padding:10px 13px;border-radius:12px;font-size:14px}
audio{width:100%;height:34px;margin-top:10px}.status{font-size:12px;color:#9297a2;margin-top:8px}
@media(max-width:480px){h1{font-size:29px}.grid{grid-template-columns:1fr 1fr}button{padding:20px 8px;font-size:15px}}
</style></head>
<body><main>
<h1>📻 RADIO BUTTON</h1><p class="sub">何を聴くか考えない。局だけ選ぶ。</p>
<h2>今なに聴く？</h2>
<div class="grid">
<button onclick="tune('pop')">🆕<br>ヒット・POP</button>
<button onclick="tune('anime')">📺<br>アニソン</button>
<button onclick="tune('90s')">💿<br>90年代</button>
<button onclick="tune('rock')">🎸<br>ロック</button>
<button onclick="tune('jazz')">🎷<br>ジャズ</button>
<button onclick="tune('chillout')">☕<br>作業・Chill</button>
<button onclick="tune('classical')">🎻<br>クラシック</button>
<button onclick="tune('dance')">🌙<br>Dance</button>
</div>
<p class="status">既存の公開インターネットラジオ局を検索して再生します。局によって地域制限・停止・ブラウザ非対応の場合があります。</p>
</main>
<div class="player"><div class="inner">
<div class="now"><div class="station"><small id="genre">局を選んでください</small><strong id="name">—</strong></div>
<div class="controls"><button onclick="nextStation()">⏭ 次の局</button></div></div>
<audio id="audio" controls playsinline></audio><div id="msg" class="status"></div>
</div></div>
<script>
const API='https://de1.api.radio-browser.info/json';
let pool=[],idx=0,currentTag='';
const labels={pop:'ヒット・POP',anime:'アニソン', '90s':'90年代',rock:'ロック',jazz:'ジャズ',chillout:'作業・Chill',classical:'クラシック',dance:'Dance'};
async function tune(tag){
 currentTag=tag; pool=[]; idx=0;
 document.getElementById('genre').textContent=labels[tag];
 document.getElementById('name').textContent='局を探しています…';
 document.getElementById('msg').textContent='';
 try{
  const u=`${API}/stations/bytag/${encodeURIComponent(tag)}?hidebroken=true&order=clickcount&reverse=true&limit=40`;
  const r=await fetch(u); const data=await r.json();
  pool=data.filter(s=>s.lastcheckok===1 && (s.url_resolved||s.url));
  if(!pool.length) throw new Error();
  play(0);
 }catch(e){
  document.getElementById('name').textContent='局を取得できませんでした';
  document.getElementById('msg').textContent='通信状況を確認して、もう一度押してください。';
 }
}
function play(i){
 if(!pool.length)return; idx=i%pool.length; const s=pool[idx];
 document.getElementById('name').textContent=s.name;
 const a=document.getElementById('audio'); a.src=s.url_resolved||s.url;
 a.play().catch(()=>{document.getElementById('msg').textContent='この局はブラウザで自動再生できません。▶︎を押すか「次の局」を試してください。'});
 fetch(`${API}/url/${s.stationuuid}`).catch(()=>{});
}
function nextStation(){if(!pool.length)return;play(idx+1)}
document.getElementById('audio').addEventListener('error',()=>{document.getElementById('msg').textContent='この局は現在再生できません。「次の局」を試してください。'})
</script></body></html>
