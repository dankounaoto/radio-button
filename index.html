<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RADIO BUTTON</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#0b0c10;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:680px;margin:auto;padding:28px 16px 270px}h1{margin:0}.tag{font-size:21px;font-weight:850;margin:8px 0}.sub,.muted{color:#a7abb4;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g{border:1px solid #2a2d35;background:#181a20;color:#fff;border-radius:18px;padding:18px 8px;font-weight:800;min-height:72px}.g:disabled{opacity:.4}.card{margin-top:18px;background:#15171d;border:1px solid #292c34;border-radius:18px;padding:16px}.why{background:#20232b;border-radius:12px;padding:11px;margin:12px 0;font-size:13px;line-height:1.5}.official{color:#fff}.player{position:fixed;left:0;right:0;bottom:0;background:#14161cf8;border-top:1px solid #292c34;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}.inner{max-width:680px;margin:auto}.station{font-size:19px;font-weight:850}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.controls button{border:0;border-radius:13px;padding:12px;font-weight:800}.play{background:#fff}.next{background:#272a32;color:#fff}.note,.status{font-size:11px;color:#9096a1}.volume{display:flex;align-items:center;gap:10px;margin-top:10px}.volume input{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;background:#4a4e58}.volume input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff}
</style></head><body><main><h1>📻 RADIO BUTTON</h1><div class="tag">選ばないから、出会える。</div><p class="sub">確認できた局から、選んだ理由と一緒に届けます。</p><div class="grid"><button class="g" data-mode="jazz">🎷<br>ジャズ</button><button class="g" data-mode="oldies">💿<br>懐かしい曲</button><button class="g" disabled>🇯🇵<br>J-POP<br><small>再選定中</small></button><button class="g" disabled>📺<br>アニソン<br><small>選定中</small></button><button class="g" disabled>🎸<br>ロック<br><small>選定中</small></button><button class="g" disabled>🎻<br>クラシック<br><small>利用条件確認中</small></button></div><section id="info" class="card"><b>まずジャンルを選んでください</b><p class="muted">「なぜこの局なのか」まで表示します。</p></section></main>
<section class="player"><div class="inner"><div class="note">NOW PLAYING</div><div id="station" class="station">—</div><div class="controls"><button id="play" class="play">▶ 再生</button><button id="next" class="next">📻 別のラジオ局</button></div><div class="note">同じジャンルの確認済み局から選びます</div><div class="volume">🔈 <input id="vol" type="range" min="0" max="1" step=".02" value=".72" aria-label="音量"> 🔊</div><div id="msg" class="status">局を選ぶと再生します。</div><audio id="audio" playsinline></audio></div></section>
<script>
const stream='https://shonanbeachfm.out.airtime.pro/shonanbeachfm_c',data={jazz:{reason:'「ジャズ」を選んだため。公式サイトでジャズ番組と公式HTTPSストリームを確認できる局を選びました。',program:'AFTERNOON JAZZ、MIDNIGHT JAZZなど。時間帯で内容は変わります。'},oldies:{reason:'「懐かしい曲」を選んだため。オールディーズ系番組を編成し、公式HTTPSストリームが公開されている局を選びました。',program:'湘南メモリーレーンなど。曜日・時間帯で内容は変わります。'}};let cur=null,a=document.getElementById('audio'),$=x=>document.getElementById(x);
function choose(m){cur=data[m];$('station').textContent='湘南ビーチFM';$('info').innerHTML='<h2>湘南ビーチFM</h2><div class="why"><b>💡 なぜこの局？</b><br>'+cur.reason+'</div><p class="muted"><b>この局について</b><br>神奈川県逗子・葉山を拠点とするコミュニティFM。音楽番組と地域情報などを24時間放送。<br><br><b>番組・放送内容</b><br>'+cur.program+'</p><a class="official" href="https://www.beachfm.co.jp/" target="_blank" rel="noopener noreferrer">🔗 確認済み公式サイト ↗</a>';a.src=stream;a.volume=+$('vol').value;a.load();a.play().catch(()=>$('msg').textContent='▶ 再生を押してください。')}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>choose(b.dataset.mode));$('play').onclick=()=>{if(!cur)return;a.paused?a.play():a.pause()};a.onplay=()=>$('play').textContent='⏸ 停止';a.onpause=()=>$('play').textContent='▶ 再生';$('vol').oninput=e=>a.volume=+e.target.value;$('next').onclick=()=>$('msg').textContent=cur?'このジャンルは確認済み局がまだ1局です。未確認局には切り替えません。':'まずジャンルを選んでください。';a.onerror=()=>$('msg').textContent='現在再生できません。未確認の代替局には切り替えません。';
</script></body></html>
